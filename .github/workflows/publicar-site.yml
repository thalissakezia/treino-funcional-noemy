name: Publicar site Noemy
# Publica a pasta imagens/ já organizada; sem importar ZIP.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'imagens/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noemy-github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código do site
        uses: actions/checkout@v4
      - name: Verificar ilustrações e preparar publicação
        shell: bash
        run: |
          set -euo pipefail
          for dia in seg ter qua qui sex sab; do
            for n in 1 2 3 4 5; do
              test -s "imagens/${dia}_${n}.webp" || { echo "Imagem ausente: ${dia}_${n}.webp"; exit 1; }
            done
            test -s "imagens/${dia}_ficha.webp" || { echo "Guia ausente: ${dia}_ficha.webp"; exit 1; }
          done
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/imagens
          cp imagens/*.webp imagens/*.svg _site/imagens/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
